name: Publish v5.8.8 from verified packages (one-time)
on:
    push:
        branches: ['chore/recover-v588-artifacts']

permissions:
    actions: read
    contents: write

jobs:
    publish:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v6
            - name: Fetch 7 verified GUI/CLI artifacts from latest build run
              uses: actions/download-artifact@v4
              with:
                  run-id: 41507351055
                  github-token: ${{ github.token }}
                  pattern: multi-downloader-nx-*
                  path: dist
                  merge-multiple: true
            - name: Fetch Windows GUI from equivalent source build
              uses: actions/download-artifact@v4
              with:
                  run-id: 41506113381
                  github-token: ${{ github.token }}
                  name: multi-downloader-nx-windows-x64-gui
                  path: dist
            - name: Verify eight unique packages and SHA-256 checksums
              shell: bash
              run: |
                  set -euo pipefail
                  cd dist
                  test "$(find . -maxdepth 1 -name '*.7z' | wc -l)" -eq 8
                  test "$(find . -maxdepth 1 -name '*.sha256' | wc -l)" -eq 8
                  for checksum in *.7z.sha256; do
                    sha256sum --check "$checksum"
                  done
            - name: Publish v5.8.8 from validated packages
              env:
                  GH_TOKEN: ${{ github.token }}
              shell: bash
              run: |
                  set -euo pipefail
                  TAG="v$(node -p "require('./package.json').version")"
                  test "$TAG" = "v5.8.8"
                  if gh release view "$TAG" >/dev/null 2>&1; then
                    gh release upload "$TAG" dist/*.7z dist/*.7z.sha256 --clobber
                  else
                    gh release create "$TAG" dist/*.7z dist/*.7z.sha256 --target "806cfe2d62b4d4b355646852ed8cebb92b611454" --title "Multi Downloader NX $TAG" --generate-notes
                  fi
