name: Release Builds

on:
    push:
        branches: [master]
    workflow_dispatch:
    release:
        types: [published]

permissions:
    contents: write

jobs:
    build:
        strategy:
            fail-fast: false
            matrix:
                include:
                    - os: ubuntu-latest
                      build_type: windows
                      build_arch: x64
                      gui: cli
                    - os: macos-latest
                      build_type: windows
                      build_arch: arm64
                      gui: cli
                    - os: ubuntu-latest
                      build_type: windows
                      build_arch: x64
                      gui: gui
                    - os: macos-latest
                      build_type: windows
                      build_arch: arm64
                      gui: gui
                    - os: ubuntu-latest
                      build_type: macos
                      build_arch: x64
                      gui: cli
                    - os: macos-latest
                      build_type: macos
                      build_arch: arm64
                      gui: cli
                    - os: ubuntu-latest
                      build_type: macos
                      build_arch: x64
                      gui: gui
                    - os: macos-latest
                      build_type: macos
                      build_arch: arm64
                      gui: gui
                    - os: ubuntu-latest
                      build_type: linux
                      build_arch: x64
                      gui: cli
                    - os: macos-latest
                      build_type: linux
                      build_arch: arm64
                      gui: cli
                    - os: ubuntu-latest
                      build_type: linux
                      build_arch: x64
                      gui: gui
                    - os: macos-latest
                      build_type: linux
                      build_arch: arm64
                      gui: gui
                    - os: ubuntu-latest
                      build_type: alpine
                      build_arch: x64
                      gui: cli
                    - os: macos-latest
                      build_type: alpine
                      build_arch: arm64
                      gui: cli
                    - os: ubuntu-latest
                      build_type: alpine
                      build_arch: x64
                      gui: gui
                    - os: macos-latest
                      build_type: alpine
                      build_arch: arm64
                      gui: gui
        runs-on: ${{ matrix.os }}
        steps:
            - name: Checkout source
              uses: actions/checkout@v6
            - uses: pnpm/action-setup@v5
              with:
                  version: latest
            - name: Set up Node.js
              uses: actions/setup-node@v6
              with:
                  node-version: 24
                  check-latest: true
            - name: Install dependencies
              run: pnpm install
            - name: Build distributable
              run: pnpm run build-${{ matrix.build_type }}-${{ matrix.build_arch }}-${{ matrix.gui }}
            - name: Upload package and checksum
              uses: actions/upload-artifact@v4
              with:
                  name: package-${{ matrix.build_type }}-${{ matrix.build_arch }}-${{ matrix.gui }}
                  path: |
                      lib/_builds/multi-downloader-nx-${{ matrix.build_type }}-${{ matrix.build_arch }}-${{ matrix.gui }}.7z
                      lib/_builds/multi-downloader-nx-${{ matrix.build_type }}-${{ matrix.build_arch }}-${{ matrix.gui }}.7z.sha256
                  if-no-files-found: error
                  retention-days: 14

    publish:
        needs: build
        runs-on: ubuntu-latest
        permissions:
            contents: write
        steps:
            - uses: actions/checkout@v6
            - uses: actions/download-artifact@v4
              with:
                  pattern: package-*
                  path: dist
                  merge-multiple: true
            - name: Publish all successful binaries as a GitHub Release
              env:
                  GH_TOKEN: ${{ github.token }}
                  EVENT_NAME: ${{ github.event_name }}
                  EVENT_TAG: ${{ github.event.release.tag_name }}
              run: |
                  set -euo pipefail
                  TAG="${EVENT_TAG:-v$(node -p "require('./package.json').version")}"
                  if gh release view "$TAG" >/dev/null 2>&1; then
                    gh release upload "$TAG" dist/*.7z dist/*.7z.sha256 --clobber
                  else
                    gh release create "$TAG" dist/*.7z dist/*.7z.sha256 --target "$GITHUB_SHA" --title "Multi Downloader NX $TAG" --generate-notes
                  fi
